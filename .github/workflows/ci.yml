# TASK-0005 — CI completa: calidad estática + unit + build + E2E.
# deploy.yml mantiene el build-check histórico; este es el gate de PRs.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  e2e:
    name: Build · Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://somvertical.ad

      - name: E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: https://somvertical.ad
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # TASK-0010 — baseline CWV. No bloqueante de momento: primera toma de
  # temperaturas; cuando los scores sean estables se quita continue-on-error
  # y se aprietan los umbrales (INV-06: LCP ≤ 2.5s · INP ≤ 200ms · CLS ≤ 0.1).
  lighthouse:
    name: Lighthouse baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://somvertical.ad

      - name: Lighthouse CI
        run: npx --yes @lhci/cli autorun
        env:
          NEXT_PUBLIC_SITE_URL: https://somvertical.ad

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
